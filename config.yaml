brand:
  name: "NammaBuildLabs"
  handle: "@namma_build_labs"
  cta: "Registration link in bio"
  colors: {bg: "#0e1815", fg: "#e8f1ed", accent: "#2dd4bf", muted: "#9fb4ab"}
start_date: "2026-11-04"        # day 1 of the 30-day calendar
timezone: "Asia/Kolkata"
reel_every_n_days: 3            # reel on day 3, 6, 9 ...
text_model: "gemini-flash-latest"   # Gemini model that writes the scripts (same GEMINI_API_KEY)
text_model_fallbacks: ["gemini-flash-lite-latest", "gemini-pro-latest"]   # tried in order if the main model is overloaded
voice: "en-IN-NeerjaNeural"     # edge-tts voice

reel_style: "mascot"            # "mascot" = illustrated host narrates, "text" = text cards only

daily_format: "series"          # "series" = daily AI video episode at 9:00 IST, "carousel" = slides + reel every 3rd day
series:
  rotation: [beginner, beginner, intermediate, advanced]   # order projects are picked; episodes per project: 1 / 2 / 3
  video_model: "gemini-omni-1.1-flash"                     # Veo 3.1 Preview was shut down on 2026-10-22; Omni Flash replaces it
  reference_image: "assets/host_reference.png"
  logo: "assets/logo-mark.png"
  # NAMMI'S FIXED LOOK. Copied word for word from the prompt that made the approved video. Do not reword it:
  # every daily prompt starts with exactly this text, so she looks the same in every clip.
  host_prompt: >-
    Vertical 9:16 animated video, about 8 seconds. A friendly young Indian woman host named Nammi, early 20s, with
    round dark glasses, long dark hair and a teal hoodie, in a stylised soft-shaded 3D animation style. Medium
    close-up, centred, slow push-in. Dark navy studio background with a soft teal, violet and pink glow, a few
    floating translucent cards, and a small glowing cube beside her.
  speech_style: "warm, upbeat Indian English"
  prompt_ending: "Natural lip sync. No on-screen text, captions or logos."

hosting: "direct"                # "direct" = upload the video straight to Instagram (Facebook Login route, no public hosting)
                                 # "public" = host it at a public link first (R2 or GitHub Pages) and give Instagram the link

# --- Telegram flow: the bot sends the script, you make the clips in the Gemini app, the bot posts them ---
telegram_flow:
  send_reference: true           # send the Nammi reference photo on day 1 (/script sends it again if asked)
instagram_upload: true           # upload to Instagram when approved (needs IG_ACCESS_TOKEN, IG_USER_ID, IG_GRAPH_BASE)
youtube_upload: false            # upload to YouTube Shorts when approved (needs YT_* secrets, see TELEGRAM-FLOW-GUIDE.md)
youtube_privacy: "private"       # YouTube locks API uploads to private until the Google project passes an audit
