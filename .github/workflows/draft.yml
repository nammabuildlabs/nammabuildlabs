name: Draft daily content
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST, ready for the 09:00 publish
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python run.py draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          PUBLIC_BASE: ${{ secrets.PUBLIC_BASE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save draft
        run: |
          git config user.name "nammabuildlabs"
          git config user.email "nammabuildlabs@gmail.com"
          git add drafts
          git commit -m "Draft $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Alert on failure
        if: failure()
        run: python run.py alert --msg "Draft job failed. Open GitHub Actions to see why."
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
