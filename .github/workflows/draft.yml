name: Draft daily content
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: echo "REEL_DATE=$(TZ=Asia/Kolkata date +%F)" >> $GITHUB_ENV
      - name: Make the video
        timeout-minutes: 30
        run: python -u run.py draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY: ${{ secrets.R2_KEY }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          PUBLIC_BASE: ${{ secrets.PUBLIC_BASE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save draft
        run: |
          git config user.name "nammabuildlabs"
          git config user.email "nammabuildlabs@gmail.com"
          git add drafts
          git commit -m "Draft $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Keep the video for the 09:00 publish job
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ env.REEL_DATE }}
          path: out/${{ env.REEL_DATE }}/reel.mp4
          retention-days: 5
          if-no-files-found: ignore
      - name: Alert on failure
        if: failure()
        run: python run.py alert --msg "Draft job failed. Open GitHub Actions to see why."
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
