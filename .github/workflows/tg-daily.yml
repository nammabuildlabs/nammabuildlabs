name: Telegram daily script
on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Send a fresh script even if one was already sent today (true or false)"
        required: false
        default: "false"
concurrency:
  group: tg-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow pyyaml requests google-genai
      - name: Send today's script to Telegram
        run: python -u run.py tg-daily ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save state
        if: always()
        run: |
          git config user.name "nammabuildlabs"
          git config user.email "nammabuildlabs@gmail.com"
          git add tg_state.json
          git commit -m "Telegram state" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
